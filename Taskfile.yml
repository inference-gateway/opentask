version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  hooks:install:
    desc: Configure Git to use the repository's pre-commit hooks
    cmds:
      - git config core.hooksPath .githooks

  setup:
    desc: Install the pre-commit hook and project dependencies
    cmds:
      - task: hooks:install
      - bun install

  typecheck:
    desc: Run strict TypeScript checks
    cmds:
      - bun run typecheck

  test:
    desc: Run the Bun test suite
    cmds:
      - bun test

  build:
    desc: Build the extension into dist/
    cmds:
      - bun run build

  package:chrome:
    desc: Package dist/ into a Chrome Web Store ZIP with SHA-256 checksum
    deps: [build]
    cmds:
      - cd dist && zip -r ../browser-extension.zip .
      - sha256sum browser-extension.zip > browser-extension.zip.sha256

  package:edge:
    desc: Package dist/ into an Edge Add-ons ZIP (same bundle, different name)
    deps: [build]
    cmds:
      - cd dist && zip -r ../edge-extension.zip .
      - sha256sum edge-extension.zip > edge-extension.zip.sha256

  build:firefox:
    desc: Build the extension for Firefox into dist/
    cmds:
      - bun run build.ts --firefox

  package:firefox:
    desc: Package dist/ into a Firefox Add-ons ZIP with SHA-256 checksum
    deps: [build:firefox]
    cmds:
      - cd dist && zip -r ../firefox-extension.zip .
      - sha256sum firefox-extension.zip > firefox-extension.zip.sha256

  build:safari:
    desc: Build the extension for Safari into dist/
    cmds:
      - bun run build.ts --safari

  package:safari:
    desc: Build the Safari extension and create a Safari Web Extension Xcode project
    deps: [build:safari]
    cmds:
      - echo "See docs/store/safari-listing.md for the full Safari packaging guide"
      - echo "Run the following on macOS with Xcode installed:"
      - echo "  xcrun safari-web-extension-converter dist/ --bundle-identifier com.inference-gateway.opentask --project-location ../safari-extension --no-open"

  check:
    desc: Run all CI checks
    cmds:
      - task: typecheck
      - task: test
      - task: build
