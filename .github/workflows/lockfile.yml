---
name: Lockfile sync

# Dependabot's npm ecosystem updates package.json but cannot regenerate
# bun.lock (no Bun lockfile support), so every Dependabot npm PR fails
# `bun install --frozen-lockfile` in CI. This job re-syncs bun.lock on the
# Dependabot branch. The commit is pushed with the maintainer App token
# because a GITHUB_TOKEN push would not re-trigger the CI workflow.

on:
  pull_request:
    paths:
      - "package.json"

permissions:
  contents: read

jobs:
  lockfile:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.INFERENCE_GATEWAY_MAINTAINER_APP_CLIENT_ID }}
          private-key: ${{ secrets.INFERENCE_GATEWAY_MAINTAINER_APP_PRIVATE_KEY }}

      - name: Resolve GitHub App bot identity
        id: app-user
        run: echo "id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: oven-sh/setup-bun@v2.2.0

      - name: Regenerate bun.lock
        run: bun install

      - name: Push the updated lockfile
        run: |
          git config user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config user.email '${{ steps.app-user.outputs.id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          git config commit.gpgsign false
          if git diff --exit-code -- bun.lock; then
            echo "bun.lock is already in sync with package.json"
            exit 0
          fi
          git add bun.lock
          git commit -m "chore(deps): sync bun.lock with package.json"
          git push