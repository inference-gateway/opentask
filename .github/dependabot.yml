---
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    # Dependabot's npm ecosystem cannot regenerate bun.lock (no Bun
    # lockfile support). .github/workflows/lockfile.yml re-syncs the
    # lockfile on these PRs so `bun install --frozen-lockfile` in CI
    # keeps passing.
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
