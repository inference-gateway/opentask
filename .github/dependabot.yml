---
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    versioning-strategy: increase
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    groups:
      github-actions:
        patterns:
          - "*"
